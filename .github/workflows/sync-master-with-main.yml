name: Sync master with main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-master-with-main
  cancel-in-progress: false

jobs:
  sync-master:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to master
        run: |
          git fetch origin main master
          git checkout -B master origin/main
          git push origin master --force-with-lease
